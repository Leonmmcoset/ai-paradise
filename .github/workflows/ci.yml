name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run in flight. The Android job is
# slow and the result it produces is superseded by the newer commit anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # pinned to the version CONTRIBUTING.md tells contributors to use, so
          # CI and the local instructions cannot drift apart
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # the generated localisations are committed, so a change that forgets to
      # re-run gen-l10n would otherwise only fail on a contributor's machine
      - name: Check the generated localizations are up to date
        run: |
          flutter gen-l10n
          if ! git diff --quiet -- lib/l10n/gen; then
            echo "::error::lib/l10n/gen is out of date. Run 'flutter gen-l10n' and commit the result."
            git diff --stat -- lib/l10n/gen
            exit 1
          fi

  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # the runner ships an Android SDK but the licence prompts have to be
      # answered before Gradle will touch it
      - name: Accept Android licences
        run: yes | flutter doctor --android-licenses > /dev/null 2>&1 || true

      - run: flutter pub get

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paradise-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-ipa:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # The repository currently does not contain an iOS platform project.
      # Generate it temporarily in CI.
      - name: Generate iOS platform
        run: flutter create --platforms=ios .

      - name: Get Flutter dependencies
        run: flutter pub get

      # Build the iOS Xcode archive without code signing.
      # Flutter intentionally does not produce an IPA when --no-codesign
      # is used, but the .xcarchive is still generated successfully.
      - name: Build unsigned iOS archive
        run: flutter build ipa --no-codesign

      # Extract the .app from the Xcode archive and package it as an IPA.
      # An IPA is simply a ZIP archive containing Payload/*.app.
      - name: Package unsigned IPA
        run: |
          set -e

          APP_PATH="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app"
          IPA_DIR="build/ios/ipa"
          PAYLOAD_DIR="${IPA_DIR}/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Runner.app was not found in the Xcode archive."
            echo "Expected: $APP_PATH"
            exit 1
          fi

          rm -rf "$IPA_DIR"
          mkdir -p "$PAYLOAD_DIR"

          cp -R "$APP_PATH" "$PAYLOAD_DIR/"

          cd "$IPA_DIR"
          zip -qry Paradise-unsigned.ipa Payload

          echo "Unsigned IPA created:"
          ls -lh Paradise-unsigned.ipa

      - name: Verify IPA
        run: |
          set -e

          IPA="build/ios/ipa/Paradise-unsigned.ipa"

          if [ ! -f "$IPA" ]; then
            echo "::error::IPA was not created."
            exit 1
          fi

          echo "=== IPA ==="
          ls -lh "$IPA"

          echo "=== IPA contents ==="
          unzip -l "$IPA" | head -50

          echo "=== Payload ==="
          unzip -l "$IPA" | grep "Payload/"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: paradise-ios-ipa
          path: build/ios/ipa/Paradise-unsigned.ipa
          retention-days: 14